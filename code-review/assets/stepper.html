<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #1c1b19;
    --pane: #262522;
    --ink: #f3efe6;
    --muted: #a39e93;
    --rule: #3a3834;
    --accent: #d4a056;
    --ready: #4a7ea8;
    --running: #d4a056;
    --suspended: #c45c48;
    --complete: #5a9a6a;
    --io: #8a6bb5;
    --hl: #3d3420;
    --hl-ink: #ffe7b3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.45 ui-sans-serif, system-ui, sans-serif; }
  .stage { min-height: 100%; display: flex; flex-direction: column; }
  header.bar {
    display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; align-items: flex-start;
    justify-content: space-between; padding: 1rem 1.25rem .85rem;
    border-bottom: 1px solid var(--rule);
  }
  header.bar h1 { font-size: 1.15rem; margin: 0 0 .25rem; font-weight: 650; }
  header.bar .lede { color: var(--muted); margin: 0; max-width: 52rem; font-size: .95rem; }
  .controls { display: flex; gap: .5rem; align-items: center; flex-shrink: 0; }
  .controls button {
    background: var(--pane); color: var(--ink); border: 1px solid var(--rule);
    border-radius: 8px; padding: .45rem .8rem; cursor: pointer; font: 600 13px/1 ui-sans-serif, system-ui, sans-serif;
  }
  .controls button:hover { border-color: var(--accent); }
  .controls button:disabled { opacity: .35; cursor: default; border-color: var(--rule); }
  .controls .count { color: var(--muted); font: 600 13px/1 ui-sans-serif, system-ui, sans-serif; min-width: 4.5rem; text-align: center; }
  .caption {
    padding: .85rem 1.25rem; background: #211f1c; border-bottom: 1px solid var(--rule);
    min-height: 3.2rem; color: var(--hl-ink); font-size: 1rem;
  }
  .caption .hint { color: var(--muted); font-size: .8rem; margin-left: .6rem; }
  .board {
    flex: 1; display: grid; grid-template-columns: minmax(18rem, 1.1fr) minmax(18rem, 1fr);
    gap: .75rem; padding: .75rem; align-items: stretch;
  }
  @media (max-width: 860px) { .board { grid-template-columns: 1fr; } }
  .pane {
    background: var(--pane); border: 1px solid var(--rule); border-radius: 10px;
    display: flex; flex-direction: column; min-height: 12rem; overflow: hidden;
  }
  .pane h2 {
    margin: 0; padding: .7rem .9rem; font-size: .78rem; letter-spacing: .08em;
    text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--rule);
  }
  .pane-body { padding: .75rem; overflow: auto; flex: 1; }
  .worlds { display: flex; flex-direction: column; gap: .75rem; }
  pre.code {
    margin: 0; font: 13px/1.55 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    white-space: pre; overflow: auto;
  }
  .ln { display: block; padding: 0 .4rem; border-radius: 3px; color: #c8c2b6; }
  .ln.hl { background: var(--hl); color: var(--hl-ink); }
  .empty { color: var(--muted); font-size: .9rem; padding: .4rem 0; }
  .card {
    border: 1px solid var(--rule); border-radius: 8px; margin-bottom: .65rem; overflow: hidden;
    opacity: .92;
  }
  .card:last-child { margin-bottom: 0; }
  .card.entering { animation: in .28s ease-out; }
  @keyframes in { from { transform: translateX(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
  .card-head {
    display: flex; justify-content: space-between; align-items: center; gap: .5rem;
    padding: .45rem .65rem; font-weight: 650; font-size: .92rem;
  }
  .card .status {
    font: 650 11px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .04em;
    text-transform: uppercase; padding: .2rem .45rem; border-radius: 999px; background: #0003;
  }
  .card.ready .card-head { background: var(--ready); }
  .card.running .card-head { background: var(--running); color: #1c1b19; }
  .card.suspended .card-head { background: var(--suspended); }
  .card.complete .card-head { background: var(--complete); }
  .card.io .card-head { background: var(--io); }
  .card.ready, .card.suspended { opacity: .7; }
  .card.running { opacity: 1; box-shadow: 0 0 0 1px var(--running); }
  .card-body { padding: .5rem .65rem .6rem; }
  .card-body pre { margin: 0; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .card-body .note { color: var(--muted); font-size: .88rem; margin: 0; }
  .spin {
    width: 12px; height: 12px; border: 2px solid #fff6; border-top-color: #fff;
    border-radius: 50%; animation: spin .8s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="stage">
  <header class="bar">
    <div>
      <h1 id="title">__TITLE__</h1>
      <p class="lede" id="lede">__LEDE__</p>
    </div>
    <div class="controls">
      <button id="prev" type="button">← Back</button>
      <span class="count" id="count">0 / 0</span>
      <button id="next" type="button">Next →</button>
      <button id="reset" type="button">Restart</button>
    </div>
  </header>
  <div class="caption" id="caption">Press Next or the right arrow to begin.</div>
  <div class="board" id="board"></div>
</div>
<script>
const ANIMATION = __ANIMATION_JSON__;

const board = document.getElementById("board");
const caption = document.getElementById("caption");
const countEl = document.getElementById("count");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const resetBtn = document.getElementById("reset");

document.getElementById("title").textContent = ANIMATION.title || "Walkthrough";
document.getElementById("lede").textContent = ANIMATION.lede || "";

const panes = ANIMATION.panes || [];
const steps = ANIMATION.steps || [];
let index = -1;
const paneEls = {};

function renderPanes() {
  board.innerHTML = "";
  const codePanes = panes.filter(p => p.kind === "code");
  const worldPanes = panes.filter(p => p.kind !== "code");

  const left = document.createElement("div");
  left.className = "worlds";
  (codePanes.length ? codePanes : panes.slice(0, 1)).forEach(p => left.appendChild(makePane(p)));

  const right = document.createElement("div");
  right.className = "worlds";
  (worldPanes.length ? worldPanes : panes.slice(1)).forEach(p => right.appendChild(makePane(p)));

  board.appendChild(left);
  if (right.childNodes.length) board.appendChild(right);
}

function makePane(pane) {
  const el = document.createElement("section");
  el.className = "pane";
  el.innerHTML = "<h2></h2><div class='pane-body'></div>";
  el.querySelector("h2").textContent = pane.title || pane.id;
  paneEls[pane.id] = el.querySelector(".pane-body");
  if (pane.kind === "code") drawCode(paneEls[pane.id], pane.lines || [], []);
  else paneEls[pane.id].innerHTML = "<p class='empty'>Nothing here yet.</p>";
  return el;
}

function drawCode(host, lines, highlight) {
  const pre = document.createElement("pre");
  pre.className = "code";
  const hl = new Set((highlight || []).map(Number));
  lines.forEach((line, i) => {
    const n = i + 1;
    const span = document.createElement("span");
    span.className = "ln" + (hl.has(n) ? " hl" : "");
    span.textContent = line.length ? line : " ";
    pre.appendChild(span);
  });
  host.innerHTML = "";
  host.appendChild(pre);
}

function drawWorld(host, cards) {
  host.innerHTML = "";
  if (!cards || !cards.length) {
    host.innerHTML = "<p class='empty'>Nothing scheduled.</p>";
    return;
  }
  cards.forEach(card => {
    const wrap = document.createElement("div");
    wrap.className = "card entering " + (card.status || "ready");
    const spin = card.status === "io" ? "<span class='spin' aria-hidden='true'></span>" : "";
    wrap.innerHTML = "<div class='card-head'><span></span><span class='status'></span></div><div class='card-body'></div>";
    wrap.querySelector(".card-head span").textContent = card.title || card.id;
    wrap.querySelector(".status").innerHTML = spin + " " + (card.status || "ready");
    const body = wrap.querySelector(".card-body");
    if (card.lines && card.lines.length) {
      drawCode(body, card.lines, card.highlight || []);
    } else if (card.note) {
      const p = document.createElement("p");
      p.className = "note";
      p.textContent = card.note;
      body.appendChild(p);
    } else {
      body.remove();
    }
    host.appendChild(wrap);
  });
}

function apply(step) {
  caption.innerHTML = (step.caption || "") +
    '<span class="hint">← → to step · Home to restart</span>';
  const highlight = step.highlight || {};
  const world = step.world || {};
  panes.forEach(pane => {
    const host = paneEls[pane.id];
    if (!host) return;
    if (pane.kind === "code") {
      drawCode(host, pane.lines || [], highlight[pane.id] || []);
    } else {
      drawWorld(host, world[pane.id] || []);
    }
  });
}

function go(n) {
  if (!steps.length) return;
  index = Math.max(-1, Math.min(steps.length - 1, n));
  if (index < 0) {
    renderPanes();
    caption.innerHTML = "Press Next or the right arrow to begin." +
      '<span class="hint">← → to step · Home to restart</span>';
  } else {
    apply(steps[index]);
  }
  countEl.textContent = Math.max(index + 1, 0) + " / " + steps.length;
  prevBtn.disabled = index < 0;
  nextBtn.disabled = index >= steps.length - 1;
}

prevBtn.onclick = () => go(index - 1);
nextBtn.onclick = () => go(index + 1);
resetBtn.onclick = () => go(-1);
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowRight") go(index + 1);
  if (e.key === "ArrowLeft") go(index - 1);
  if (e.key === "Home") go(-1);
});

renderPanes();
go(-1);
</script>
</body>
</html>
